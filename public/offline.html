<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#181719" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Orbit — Offline</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0c11;
      --surface: #1a1820;
      --border: rgba(255,255,255,0.08);
      --accent: #dbe878;
      --text: #ffffff;
      --muted: #7c7a85;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #offline-root {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 2rem 1.5rem;
      text-align: center;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(219,232,120,0.07) 0%, transparent 70%),
                  var(--bg);
    }

    .icon-wrap {
      width: 88px;
      height: 88px;
      border-radius: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2rem;
      box-shadow: 0 0 40px rgba(219,232,120,0.12);
    }

    .wave {
      display: flex;
      align-items: flex-end;
      gap: 5px;
      height: 36px;
    }
    .wave span {
      display: block;
      width: 5px;
      border-radius: 99px;
      background: var(--accent);
      animation: wave 1.2s ease-in-out infinite;
    }
    .wave span:nth-child(1) { height: 14px; animation-delay: 0s; }
    .wave span:nth-child(2) { height: 30px; animation-delay: 0.15s; }
    .wave span:nth-child(3) { height: 22px; animation-delay: 0.3s; }
    .wave span:nth-child(4) { height: 36px; animation-delay: 0.1s; }
    .wave span:nth-child(5) { height: 18px; animation-delay: 0.25s; }

    @keyframes wave {
      0%, 100% { transform: scaleY(0.5); opacity: 0.6; }
      50% { transform: scaleY(1); opacity: 1; }
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    h1 span { color: var(--accent); }

    p {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.6;
      max-width: 300px;
      margin: 0 auto 2rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.75rem;
      border-radius: 99px;
      font-weight: 700;
      font-size: 0.875rem;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: transform 0.15s, opacity 0.15s;
    }
    .btn:active { transform: scale(0.96); }

    .btn-primary {
      background: var(--accent);
      color: #0e0c11;
    }

    .btn-ghost {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
      max-width: 240px;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      margin-right: 0.4rem;
      box-shadow: 0 0 6px #ef4444;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 99px;
      padding: 0.25rem 0.75rem;
      font-size: 0.75rem;
      color: #f87171;
      margin-bottom: 1.25rem;
    }
  </style>
</head>
<body>
  <div id="offline-root">
    <div class="icon-wrap">
      <div class="wave">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>

    <div class="badge">
      <span class="status-dot"></span>
      No Internet Connection
    </div>

    <h1>You're <span>Offline</span></h1>
    <p>No worries — your downloaded music is ready to play anytime, even without internet.</p>

    <div class="actions">
      <a href="/downloaded" class="btn btn-primary">
        🎵 Open Downloaded Music
      </a>
      <button class="btn btn-ghost" onclick="window.location.reload()">
        ↺ Try Again
      </button>
    </div>
  </div>

  <script>
    // Auto-redirect to /downloaded when loaded as the offline fallback
    // But only if we came from a navigation (not a direct open)
    if ('serviceWorker' in navigator) {
      // Check if we have internet now (user may have reconnected)
      window.addEventListener('online', () => {
        window.location.reload();
      });
    }

    // If the user actually typed /downloaded, go there directly
    const path = window.location.pathname;
    if (path !== '/offline.html' && path !== '/') {
      // They were trying to navigate somewhere specific offline
      // Redirect to downloaded page gracefully
      if (path !== '/downloaded') {
        setTimeout(() => {
          window.location.href = '/downloaded';
        }, 2500);
      }
    }
  </script>
</body>
</html>
